name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # Build the notes-api image for amd64 and arm64 (Apple Silicon, Raspberry Pi)
  # and tag it with the appVersion of the notes-app chart.
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read appVersion
        id: version
        run: echo "tag=$(yq '.appVersion' charts/notes-app/Chart.yaml)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: apps/notes-api
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/howest-mct/helm-demo-api:${{ steps.version.outputs.tag }}
            ghcr.io/howest-mct/helm-demo-api:latest
          labels: |
            org.opencontainers.image.source=https://github.com/howest-mct/helm-demo
            org.opencontainers.image.description=Notes API used by the notes-app Helm chart
            org.opencontainers.image.licenses=Apache-2.0

  # Package every chart with a new version, attach it to a GitHub release and
  # update index.yaml on the gh-pages branch (served by GitHub Pages).
  charts:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        with:
          charts_dir: charts
          config: cr.yaml
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
