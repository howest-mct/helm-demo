{{- if include "notes-app.createDbSecret" . }}
{{- $name := include "notes-app.dbSecretName" . }}
{{- $password := .Values.postgresql.auth.password }}
{{- if not .Values.postgresql.enabled }}
{{- $password = required "externalDatabase.password or externalDatabase.existingSecret is required" .Values.externalDatabase.password }}
{{- end }}
{{- if not $password }}
{{- /* Reuse the password from a previous install, so `helm upgrade` does not lock the app out of its own database */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if $existing }}
{{- $password = index $existing.data "password" | b64dec }}
{{- else }}
{{- $password = randAlphaNum 24 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "notes-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
type: Opaque
data:
  password: {{ $password | b64enc | quote }}
{{- end }}
