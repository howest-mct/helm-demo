apiVersion: v1
kind: Service
metadata:
  name: {{ include "notes-app.componentName" (list . "api") }}
  labels:
    {{- include "notes-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
  selector:
    {{- include "notes-app.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
